<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="light dark" />
  <title>Entrar | FlexBox Trainer</title>
  <link rel="preload" href="./fontes/space-grotesk.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="faixa" aria-hidden="true"></div>
  <main class="pagina">
    <section class="marca" aria-labelledby="pageTitle">
      <p class="rotulo surge" style="--ordem: 0"><span class="numero">00</span> / Entrar</p>
      <h1 id="pageTitle" class="surge" style="--ordem: 1">FlexBox <span>Trainer</span></h1>
      <p class="descricao surge" style="--ordem: 2">Extensão para treinamento de recriação de layouts em HTML e CSS.</p>
    </section>

    <section class="painel surge" style="--ordem: 3" aria-label="Entrar com Google">
      <p class="notice" id="notice">Use a conta Google com o e-mail cadastrado no torneio.</p>

      <div class="google-auth" id="googleAuth">
        <div id="googleButton" class="google-button-wrap" aria-live="polite"></div>
        <label class="remember-option">
          <input id="remember" type="checkbox" checked />
          <span>Manter conectado neste dispositivo</span>
        </label>
      </div>

      <div class="status" id="status" role="status" aria-live="polite">Carregando o Google…</div>

      <p class="rodape">Ao terminar, o navegador pede para abrir o VS&nbsp;Code.</p>
    </section>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
